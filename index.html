<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock Search</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Settings Button -->
    <button id="settingsBtn" class="settings-btn" title="Ayarlar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </button>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h2>Doğum Tarihinizi Girin</h2>
            <p>Yaşınızın doğru hesaplanması için doğum tarihinizi ve saatinizi girin.</p>
            <input type="datetime-local" id="dobInput">
            <label for="decimalsInput" style="display:block; text-align:left; color:#aaa; font-size:0.9rem; margin-bottom:0.5rem;">Ondalık Basamak Sayısı:</label>
            <input type="number" id="decimalsInput" min="0" max="15" value="9" style="width:100%; padding:0.8rem; border-radius:8px; border:1px solid var(--glass-border); background:rgba(0,0,0,0.5); color:#fff; font-size:1rem; margin-bottom:1.5rem;">
            
            <label for="engineInput" style="display:block; text-align:left; color:#aaa; font-size:0.9rem; margin-bottom:0.5rem;">Arama Motoru:</label>
            <select id="engineInput" style="width:100%; padding:0.8rem; border-radius:8px; border:1px solid var(--glass-border); background:rgba(0,0,0,0.5); color:#fff; font-size:1rem; margin-bottom:1.5rem; appearance:none; outline:none; cursor:pointer;">
                <option value="google">Google</option>
                <option value="duckduckgo">DuckDuckGo</option>
                <option value="brave">Brave Search</option>
            </select>
            <div class="modal-actions">
                <button id="saveBtn" class="btn primary">Kaydet</button>
                <button id="cancelBtn" class="btn secondary">İptal</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container">
        
        <!-- The Clock / Sphere Area -->
        <div class="clock-container">
            <div class="sphere" id="sphere">
                <div class="orbit" id="orbit">
                    <!-- Dots will be injected here by JS -->
                </div>
            </div>
            <!-- The highly precise age counter -->
            <div class="age-display">
                <span id="ageCounter">0.000000000</span>
            </div>
        </div>

        <!-- Search Box -->
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" placeholder="Google'da ara..." autocomplete="off">
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
